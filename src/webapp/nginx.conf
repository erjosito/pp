server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/markdown
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # Cache static assets aggressively (except HTML)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache HTML, JSON or markdown so updates are visible
    location ~* \.(html|json|md)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Health endpoint for Container Apps probes
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA-style fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
